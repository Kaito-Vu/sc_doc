# Single-entrypoint gateway: one port/domain, path-routed to internal services.
#   /drawio/  -> self-hosted draw.io
#   /         -> Docmost (incl. websocket upgrade for /collab and /socket.io)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Server has no compression of its own; 2.5MB+ JS bundles shrink ~70% with gzip.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml font/ttf font/otf application/wasm;

server {
    listen 80;
    client_max_body_size 200m;

    location = /drawio { return 301 /drawio/; }

    location /drawio/ {
        proxy_pass http://drawio:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        proxy_pass http://docmost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
    }
}
