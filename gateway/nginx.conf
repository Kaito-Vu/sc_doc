# Single-entrypoint gateway: one port/domain, path-routed to internal services.
#   /drawio/  -> self-hosted draw.io
#   /         -> Docmost (incl. websocket upgrade for /collab and /socket.io)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Server has no compression of its own; 2.5MB+ JS bundles shrink ~70% with gzip.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml font/ttf font/otf application/wasm;

# Client IP from the TLS proxy in front (X-Forwarded-For), trusted only from private ranges,
# so logs and rate limits key on the real client, not the proxy.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Rate limiting (per client IP). Generous for the SPA; strict for password login.
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    limit_req zone=general burst=100 nodelay;
    limit_conn perip 100;
    client_max_body_size 200m;
    # Emit relative redirects so the public host/port (e.g. :8888) is preserved.
    absolute_redirect off;

    # Brute-force protection on login (burst allows a few quick retries).
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://docmost:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /drawio { return 301 /drawio/; }

    location /drawio/ {
        proxy_pass http://drawio:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        proxy_pass http://docmost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
    }
}
