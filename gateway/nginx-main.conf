# Main config baked into the image (static nginx on scratch). The site config
# is mounted at /etc/nginx/conf.d/default.conf (see docker-compose.yml).
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Real client IP ($remote_addr is rewritten by realip in default.conf), timings, upstream.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time '
                    'cs=$upstream_cache_status host=$host xff="$http_x_forwarded_for"';
    access_log /dev/stdout main;
    sendfile on;
    keepalive_timeout 65;
    include /etc/nginx/conf.d/*.conf;
}
