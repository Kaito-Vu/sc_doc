# ---------------------------------------------------------------------------
# Docmost stack.
#
# All secrets and tunables live in `.env` (git-ignored), NOT in this file.
# Bootstrap once with:
#   cp .env.example .env   # then fill in the values
# ---------------------------------------------------------------------------

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  docmost:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    init: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
      gotenberg:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?set APP_URL in .env}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-docmost}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-docmost}"
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-http://seaweedfs:8333}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-docmost}
      AWS_S3_REGION: ${AWS_S3_REGION:-us-east-1}
      AWS_S3_FORCE_PATH_STYLE: "${AWS_S3_FORCE_PATH_STYLE:-true}"
      AWS_S3_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:?set SEAWEEDFS_ACCESS_KEY in .env}
      AWS_S3_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:?set SEAWEEDFS_SECRET_KEY in .env}
      MAIL_DRIVER: ${MAIL_DRIVER:-smtp}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-E-Doc}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}
      # Public URL of draw.io via the gateway, e.g. https://doc.etc.vn/drawio
      DRAWIO_URL: ${DRAWIO_URL:-}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - docmost:/app/data/storage
    logging: *default-logging
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  # Single entrypoint: point your TLS proxy at this port (was the docmost port).
  gateway:
    build: ./gateway
    image: sc_doc-gateway:latest
    restart: unless-stopped
    depends_on:
      - docmost
      - drawio
    ports:
      - "${DOCMOST_PORT:-8888}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  # Self-hosted draw.io editor so diagrams work without internet access.
  drawio:
    build: ./drawio
    image: sc_doc-drawio:latest
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  gotenberg:
    build: ./gotenberg
    image: sc_doc-gotenberg:latest
    restart: unless-stopped
    # Internal only: renders draw.io SVG to PNG for DOCX export.
    command: ["gotenberg", "--api-timeout=60s"]
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    build: ./db
    image: sc_doc-db:latest
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docmost}
      POSTGRES_USER: ${POSTGRES_USER:-docmost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  seaweedfs:
    build: ./seaweedfs
    image: sc_doc-seaweedfs:latest
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    # Exposed to the host on loopback only, for administration. The Docmost
    # service reaches SeaweedFS over the internal compose network.
    ports:
      - "127.0.0.1:${SEAWEEDFS_MASTER_PORT:-9333}:9333"
      - "127.0.0.1:${SEAWEEDFS_S3_PORT:-8686}:8888"
    command:
      - |
        mkdir -p /etc/seaweedfs
        cat > /etc/seaweedfs/s3.json <<'EOF'
        {
          "identities": [
            {
              "name": "docmost",
              "credentials": [
                {
                  "accessKey": "${SEAWEEDFS_ACCESS_KEY}",
                  "secretKey": "${SEAWEEDFS_SECRET_KEY}"
                }
              ],
              "actions": ["Read", "Write", "List", "Tagging", "Admin"]
            }
          ]
        }
        EOF
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip=seaweedfs -master.volumeSizeLimitMB=1024 -volume.max=0
    volumes:
      - ./data/seaweedfs:/data
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9333/cluster/status"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  seaweedfs-init:
    image: sc_doc-seaweedfs:latest
    restart: "no"
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        weed shell -master=seaweedfs:9333 -c "s3.bucket.create -name ${AWS_S3_BUCKET:-docmost}" || true
    logging: *default-logging

volumes:
  docmost:
  db_data:
  redis_data:
